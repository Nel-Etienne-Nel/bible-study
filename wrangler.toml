# Cloudflare Pages config.
#
# The site is static — no Workers, no functions, no runtime. `node build.js`
# generates every page into dist/, which is all that gets published.
#
#   node build.js && npx wrangler pages deploy
#
# For the Git integration, set the build command to `node build.js` in the
# Pages project settings; the output directory is read from here.

name = "song-of-solomon-study"
compatibility_date = "2026-08-02"
pages_build_output_dir = "dist"
