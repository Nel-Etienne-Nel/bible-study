# Cloudflare Workers config — a static site served as Worker assets.
#
# There is no Worker code: `node build.js` generates every page into dist/,
# and Cloudflare serves that directory as-is. _headers is honoured.
#
# In the Cloudflare project settings (Settings → Build):
#   Build command:   node build.js
#   Deploy command:  npx wrangler deploy
#
# `name` must match the Worker's name in Cloudflare, or the deploy fails.

name = "bible-study"
compatibility_date = "2026-09-24"

[assets]
directory = "./dist"
# /books/isaiah/ is served from books/isaiah/index.html
html_handling = "auto-trailing-slash"
